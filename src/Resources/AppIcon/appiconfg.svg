<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     role="img"
     aria-label="BotanicSoft orchid logo"
     viewBox="0 0 1024 1024"
     fill="none">
    <title>BotanicSoft Orchid</title>
    <desc>A botanical Cattleya orchid bloom mark drawn with a bold botanical outline, ruffled wing petals, frilled three-lobed trumpet labellum with golden throat striations, and arching orchid leaves.</desc>
    <!-- Tokens: ink #6D5443, leaf #78D978, petals #EADDFF #B69DF8 #9A82DB, labellum #6750A4, core #FFE2E4, nectar #F6C667. -->
    <g transform="translate(512 512) scale(0.88) translate(-512 -512)">
        <!-- Natural S-Curve Orchid Stem -->
        <path id="stem"
              d="M506 904C488 818 494 728 512 630"
              fill="none"
              stroke="#6D5443"
              stroke-width="26"
              stroke-linecap="round" />

        <!-- Arching Lanceolate Orchid Strap Leaves (#78D978) -->
        <path id="leaf-left"
              d="M506 884C414 880 286 824 210 722C316 690 438 742 508 848Z"
              fill="#78D978"
              stroke="#6D5443"
              stroke-width="18"
              stroke-linejoin="round" />
        <path id="leaf-right"
              d="M508 884C602 880 732 820 812 714C704 684 580 738 508 848Z"
              fill="#78D978"
              stroke="#6D5443"
              stroke-width="18"
              stroke-linejoin="round" />
        <!-- Leaf Midrib Veins -->
        <path id="leaf-vein-left"
              d="M488 858C416 810 336 768 258 738"
              fill="none"
              stroke="#6D5443"
              stroke-width="10"
              stroke-linecap="round" />
        <path id="leaf-vein-right"
              d="M528 858C602 808 684 764 762 732"
              fill="none"
              stroke="#6D5443"
              stroke-width="10"
              stroke-linecap="round" />

        <!-- 1. Dorsal Sepal (12 o'clock Upright Acuminate Cattleya Sepal) -->
        <path id="sepal-top"
              d="M472 436C438 334 440 210 486 116C498 92 510 82 520 96C566 172 582 310 552 436Z"
              fill="#EADDFF"
              stroke="#6D5443"
              stroke-width="20"
              stroke-linejoin="round" />
        <path id="sepal-top-vein"
              d="M512 392C510 298 510 208 514 132"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.52" />

        <!-- 2. Lower Left Lateral Sepal (7-8 o'clock Sweeping Lanceolate Sepal) -->
        <path id="sepal-lower-left"
              d="M482 460C392 492 308 558 268 638C254 666 276 690 312 680C404 654 476 574 504 490Z"
              fill="#EADDFF"
              stroke="#6D5443"
              stroke-width="20"
              stroke-linejoin="round" />

        <!-- 3. Lower Right Lateral Sepal (4-5 o'clock Sweeping Lanceolate Sepal) -->
        <path id="sepal-lower-right"
              d="M542 460C632 492 716 558 756 638C770 666 748 690 712 680C620 654 548 574 520 490Z"
              fill="#EADDFF"
              stroke="#6D5443"
              stroke-width="20"
              stroke-linejoin="round" />

        <!-- 4. Broad Ruffled Left Cattleya Wing Petal (9-10 o'clock 3-Wave Margin) -->
        <path id="petal-left"
              d="M482 430C420 302 304 214 204 232C154 242 136 288 154 330C120 360 118 412 154 446C146 488 182 526 238 530C330 536 420 500 488 462Z"
              fill="#B69DF8"
              stroke="#6D5443"
              stroke-width="20"
              stroke-linejoin="round" />
        <!-- Left Wing Delicate Fan Veins -->
        <path id="petal-left-vein-1"
              d="M452 422C376 350 290 300 204 282"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
