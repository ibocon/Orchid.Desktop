        <path id="petal-left-vein-2"
              d="M444 440C354 402 266 384 180 386"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.48" />
        <path id="petal-left-vein-3"
              d="M446 456C366 456 290 466 220 482"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.48" />

        <!-- 5. Broad Ruffled Right Cattleya Wing Petal (2-3 o'clock 3-Wave Margin) -->
        <path id="petal-right"
              d="M542 430C604 302 720 214 820 232C870 242 888 288 870 330C904 360 906 412 870 446C878 488 842 526 786 530C694 536 604 500 536 462Z"
              fill="#9A82DB"
              stroke="#6D5443"
              stroke-width="20"
              stroke-linejoin="round" />
        <!-- Right Wing Delicate Fan Veins -->
        <path id="petal-right-vein-1"
              d="M572 422C648 350 734 300 820 282"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.48" />
        <path id="petal-right-vein-2"
              d="M580 440C670 402 758 384 844 386"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.48" />
        <path id="petal-right-vein-3"
              d="M578 456C658 456 734 466 804 482"
              fill="none"
              stroke="#6D5443"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.48" />

        <!-- 6. Three-Lobed Frilled Cattleya Labellum (Side Lobes + 5-Scallop Ruffled Trumpet Skirt, #6750A4) -->
        <path id="labellum"
              d="M474 414C418 398 382 442 404 496C416 524 430 540 416 566C382 604 398 658 442 668C458 704 496 710 512 686C528 710 566 704 582 668C626 658 642 604 608 566C594 540 608 524 620 496C642 442 606 398 550 414Z"
              fill="#6750A4"
              stroke="#6D5443"
              stroke-width="22"
              stroke-linejoin="round" />

        <!-- 7. Golden-Amber Cattleya Throat & Radiating Striations (#F6C667) -->
        <path id="labellum-throat"
              d="M474 448C442 468 440 524 466 566C484 594 498 610 512 620C526 610 540 594 558 566C584 524 582 468 550 448Z"
              fill="#F6C667"
              stroke="#6D5443"
              stroke-width="14"
              stroke-linejoin="round" />
        <path id="throat-veins"
              d="M512 474V590M494 484C482 514 470 540 460 558M530 484C542 514 554 540 564 558"
              fill="none"
              stroke="#6D5443"
              stroke-width="10"
              stroke-linecap="round" />

        <!-- 8. Compact Arched Orchid Column Hood (Gynostemium, #FFE2E4) -->
        <path id="stigma-core"
              d="M478 430C478 392 546 392 546 430C546 452 530 464 512 464C494 464 478 452 478 430Z"
              fill="#FFE2E4"
              stroke="#6D5443"
              stroke-width="16"
              stroke-linejoin="round" />
    </g>
</svg>
