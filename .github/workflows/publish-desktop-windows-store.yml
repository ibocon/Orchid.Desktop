name: publish-desktop-windows-store

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or full SHA). Defaults to the dispatch ref.'
        required: false
        default: ''
      runtime_environment:
        description: 'Relay environment URL baked into the desktop package.'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Staging
          - Production
      publish_to_store:
        description: 'Submit the built MSIX package to Microsoft Store Partner Center.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-desktop-windows-store-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish desktop msix to windows store
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_TFM: net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Publish MSIX package
        shell: pwsh
        run: |
          $RelayUrl = if ('${{ inputs.runtime_environment }}' -eq 'Production') {
            'https://prod.botanicsoft.com/orchid'
          } else {
            'https://stag.botanicsoft.com/orchid'
          }
          dotnet publish src/Orchid.Desktop.csproj `
            -f $env:WINDOWS_TFM `
            -c Release `
            -r win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:OrchidRelayUrl=$RelayUrl `
            -p:EnforceCodeStyleInBuild=false

      - name: Setup Microsoft Store CLI
        if: ${{ inputs.publish_to_store }}
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to Microsoft Store
        if: ${{ inputs.publish_to_store }}
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_APP_ID)) {
            throw 'MSSTORE_APP_ID secret is required for Windows Store submission.'
          }
          $Msix = Get-ChildItem -Path src/bin/Release -Recurse -Filter '*.msix' | Select-Object -First 1
          if ($null -eq $Msix) {
            throw 'MSIX package was not generated under src/bin/Release.'
          }
          msstore reconfigure `
            --tenantId $env:MSSTORE_TENANT_ID `
            --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID `
            --clientSecret $env:MSSTORE_CLIENT_SECRET

          $TokenRes = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:MSSTORE_TENANT_ID)/oauth2/v2.0/token" -Body @{
            grant_type    = 'client_credentials'
            client_id     = $env:MSSTORE_CLIENT_ID
            client_secret = $env:MSSTORE_CLIENT_SECRET
            scope         = 'https://manage.devcenter.microsoft.com/.default'
          }
          $Headers = @{ Authorization = "Bearer $($TokenRes.access_token)" }
          $AppUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$($env:MSSTORE_APP_ID)"
          $AppRes = Invoke-RestMethod -Method Get -Uri $AppUri -Headers $Headers
          $SubId = $AppRes.pendingApplicationSubmission.id
          if (-not [string]::IsNullOrWhiteSpace($SubId)) {
            $SubRes = Invoke-RestMethod -Method Get -Uri "$AppUri/submissions/$SubId" -Headers $Headers
            if ($SubRes.status -eq 'CommitFailed') {
              Invoke-RestMethod -Method Delete -Uri "$AppUri/submissions/$SubId" -Headers $Headers | Out-Null
              $SubId = $null
            }
          }
          if ([string]::IsNullOrWhiteSpace($SubId) -and $null -eq $AppRes.lastPublishedApplicationSubmission) {
            $Created = Invoke-RestMethod -Method Post -Uri "$AppUri/submissions" -Headers $Headers -ContentType 'application/json' -Body '{}'
            $SubId = $Created.id
          }
          if (-not [string]::IsNullOrWhiteSpace($SubId)) {
            $SubRes = Invoke-RestMethod -Method Get -Uri "$AppUri/submissions/$SubId" -Headers $Headers
            if ($SubRes.applicationCategory -eq 'NotSet' -or $null -eq $SubRes.listings.'en-us') {
              $SubRes.applicationCategory = 'Productivity'
              $SubRes.listings = @{
                'en-us' = @{
                  baseListing = @{
                    title                     = 'Universal Clipboard Bridge'
                    description               = 'Universal Clipboard Bridge (Orchid) synchronizes text, images, and files across Windows PC, Android, and Web in real time with end-to-end encryption (AES-256-GCM).'
                    shortDescription          = 'End-to-end encrypted real-time clipboard bridge across PC, mobile, and web.'
                    releaseNotes              = 'Initial release of Universal Clipboard Bridge for Windows.'
                    features                  = @(
                      'End-to-end encrypted (AES-256-GCM) clipboard synchronization',
                      'Real-time text, image, and file clipboard sharing across Windows, Android, and Web',
                      'Instant device pairing via room code'
                    )
                    images                    = @(
                      @{
                        fileName   = 'https://raw.githubusercontent.com/ibocon/Orchid.Desktop/main/docs/release/windows-store/screenshots/desktop-main.png'
                        fileStatus = 'PendingUpload'
                        imageType  = 'Screenshot'
                      }
                    )
                    recommendedHardware       = @()
                    minimumHardware           = @()
                    copyrightAndTrademarkInfo = 'BotanicSoft'
                    privacyPolicy             = 'https://stag.botanicsoft.com/orchid/'
                  }
                }
              }
              $SubRes.allowTargetFutureDeviceFamilies = @{
                Desktop     = $true
                Mobile      = $false
                Holographic = $false
                Xbox        = $false
              }
              Invoke-RestMethod -Method Put -Uri "$AppUri/submissions/$SubId" -Headers $Headers -Body ($SubRes | ConvertTo-Json -Depth 12) -ContentType 'application/json; charset=utf-8' | Out-Null
            }
          }

          msstore publish $Msix.FullName --appId $env:MSSTORE_APP_ID --noCommit false